services:
  generator:
    build:
      context: .
      dockerfile: Dockerfile.generator
    profiles: ["generate"]
    volumes:
      - ./movies:/data/movies
      - ./songs:/data/songs
      - ./public:/data/public
      - ./config.json:/data/config.json:ro
    environment:
      CONFIG_PATH: /data/config.json

  web:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - web-root:/usr/share/nginx/html
      - ./public:/usr/share/nginx/html/public:ro
      - ./movies:/usr/share/nginx/html/movies:ro
      - ./songs:/usr/share/nginx/html/songs:ro

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  web-root:
  caddy-data:
  caddy-config:
