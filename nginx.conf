server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/public;
    absolute_redirect off;

    sendfile on;
    tcp_nopush on;

    location = /movie {
        return 301 /movie/;
    }
    location = /movie/ {
        try_files /movie.html =404;
    }
    location = /movies {
        return 301 /movie/;
    }
    location = /movies/ {
        try_files /movie.html =404;
    }

    location = /music {
        return 301 /music/;
    }
    location = /music/ {
        try_files /music.html =404;
    }
    location = /musics {
        return 301 /music/;
    }
    location = /musics/ {
        try_files /music.html =404;
    }

    location /movies/ {
        alias /usr/share/nginx/html/movies/;
    }

    location /songs/ {
        alias /usr/share/nginx/html/songs/;
    }

    location ~* \.m3u8$ {
        default_type application/vnd.apple.mpegurl;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.ts$ {
        default_type video/mp2t;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
